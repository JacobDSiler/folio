<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Group promo — Folio</title>
<meta name="description" content="A group of Folio authors promoting each other's books. Sign up once, discover several new writers, subscribe to the ones you love."/>
<meta name="robots" content="index, follow"/>
<link rel="icon" href="/favicon.ico"/>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#f6f2e8;--surface:#fffcf5;--text:#1a1504;--muted:#5e5137;--hint:#8a7f65;
    --border:rgba(0,0,0,0.09);--accent:#c98c2a;--accent-ui:#0d5b3e;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --serif:'Playfair Display',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.65}
  a{color:var(--accent-ui);text-decoration:none;border-bottom:.5px solid rgba(13,91,62,0.3)}
  a:hover{border-bottom-color:var(--accent-ui)}
  header{padding:22px 24px;text-align:center;background:var(--surface);border-bottom:.5px solid var(--border)}
  header .brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--text);border:0}
  header .brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--serif)}
  main{max-width:820px;margin:0 auto;padding:44px 22px 60px}
  .hero{text-align:center;margin-bottom:42px}
  .eyebrow{display:inline-block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:12px}
  h1{font-family:var(--serif);font-size:38px;font-weight:600;margin:0 0 12px;line-height:1.12;letter-spacing:-0.01em}
  .lead{font-size:16px;color:var(--muted);margin:0 auto 16px;max-width:560px;line-height:1.65;white-space:pre-wrap}
  .date{font-size:13.5px;color:var(--accent);font-weight:500}
  .books{margin-top:32px}
  .books h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 4px;text-align:center}
  .books .note{color:var(--muted);text-align:center;font-size:14px;margin:0 0 22px}
  .book-card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:14px;transition:border-color .15s}
  .book-card:hover{border-color:var(--accent)}
  .book-card h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px;line-height:1.25}
  .book-card .by{font-size:13.5px;color:var(--muted);font-style:italic;margin-bottom:10px}
  .book-card .pitch{font-size:14px;line-height:1.65;color:var(--text);margin:0;white-space:pre-wrap}
  .empty{padding:38px 22px;text-align:center;border:.5px dashed var(--border);border-radius:12px;color:var(--hint);line-height:1.7}
  footer{margin-top:44px;text-align:center;font-size:12.5px;color:var(--hint)}
  footer a{color:var(--hint);border-bottom:.5px dotted currentColor}
  .status{text-align:center;padding:60px 22px;color:var(--hint)}
</style>
</head>
<body>

<header>
  <a href="/" class="brand"><span class="brand-mark">F</span>Folio</a>
</header>

<main>
  <div id="loadStatus" class="status">Loading promo…</div>
  <div id="content" style="display:none">
    <div class="hero">
      <div class="eyebrow">Group promo</div>
      <h1 id="promoTitle">—</h1>
      <p class="lead" id="promoBody"></p>
      <p class="date" id="promoDate"></p>
    </div>
    <div class="books">
      <h2>Books in this promo</h2>
      <p class="note">Each of these authors is participating. Discover them, subscribe to the ones you love.</p>
      <div id="bookList"></div>
    </div>
  </div>
  <footer id="footNav">
    <a href="/authors/">← Back to the author board</a>
    ·
    <a href="/shelf/">Browse the Folio Shelf</a>
    ·
    <a href="/">Publish your own folio</a>
  </footer>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyDxLI57pgS9WX1ekMerbcx8M6aVeWacpy0', authDomain:'auth.jacobsiler.com', projectId:'miscellaneous-117e9', storageBucket:'miscellaneous-117e9.firebasestorage.app', messagingSenderId:'514858431339', appId:'1:514858431339:web:8b3acbe89966b45fe3922e' };
const app = initializeApp(firebaseConfig, 'promo');
const db = getFirestore(app);

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}); }catch(_){ return ''; } }

const params = new URLSearchParams(location.search);
const id = params.get('id') || '';

(async () => {
  const statusEl = document.getElementById('loadStatus');
  if (!id) { statusEl.innerHTML = 'No promo id — pass <code>?id=&lt;swapId&gt;</code>.'; return; }
  try {
    const swapSnap = await getDoc(doc(db, 'folio_author_swaps', id));
    if (!swapSnap.exists()) { statusEl.textContent = 'Promo not found.'; return; }
    const swap = swapSnap.data() || {};
    if (swap.type !== 'group-promo') { statusEl.textContent = 'That swap is not a group promo.'; return; }
    document.title = (swap.title || 'Group promo') + ' — Folio';
    document.getElementById('promoTitle').textContent = swap.title || 'Untitled promo';
    document.getElementById('promoBody').textContent = swap.body || '';
    if (swap.swapDate) document.getElementById('promoDate').textContent = 'Live on ' + fmtDate(swap.swapDate);
    // Books = the replies. Convention: each replier types their book pitch
    // in the reply body. First line = book title, second line + = pitch.
    const repSnap = await getDocs(query(collection(db, 'folio_author_swaps', id, 'replies'), orderBy('createdAt','asc'), limit(50)));
    const replies = repSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    // The poster's OWN book is the first entry — take it from swap.body.
    const list = document.getElementById('bookList');
    let html = '';
    // Poster listing.
    if (swap.body) {
      const lines = swap.body.split('\n').filter(Boolean);
      const firstLine = lines[0] || 'Book';
      const rest = lines.slice(1).join('\n').trim();
      html += '<div class="book-card">'
        +'<h3>'+esc(firstLine)+'</h3>'
        +'<div class="by">by '+esc(swap.authorPenName || 'Author')+' <span style="font-style:normal;color:var(--accent-ui);font-weight:600">· organiser</span></div>'
        +(rest?'<p class="pitch">'+esc(rest)+'</p>':'')
      +'</div>';
    }
    if (!replies.length && !swap.body) {
      html += '<div class="empty">No participants yet — check back closer to the promo date.</div>';
    } else {
      replies.forEach(r => {
        const b = String(r.body || '').trim();
        const lines = b.split('\n').filter(Boolean);
        const firstLine = lines[0] || 'Book';
        const rest = lines.slice(1).join('\n').trim();
        html += '<div class="book-card">'
          +'<h3>'+esc(firstLine)+'</h3>'
          +'<div class="by">by '+esc(r.authorPenName || 'Author')+'</div>'
          +(rest?'<p class="pitch">'+esc(rest)+'</p>':'')
        +'</div>';
      });
    }
    list.innerHTML = html;
    statusEl.style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (e) {
    statusEl.textContent = 'Load failed: ' + (e.message || e);
  }
})();
</script>
</body>
</html>
