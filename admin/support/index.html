<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Folio Admin — Support tickets</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin/>
<link rel="icon" href="/favicon.ico"/>
<style>
  :root{
    --bg:#f6f4ee;--surface:#fff;--text:#1a1611;--muted:#5a5347;--hint:#8a8378;
    --border:rgba(0,0,0,0.10);--border-mid:rgba(0,0,0,0.14);
    --accent:#c98c2a;--accent-ui:#065f46;--danger:#b91c1c;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --serif:'Playfair Display',Georgia,serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#141210;--surface:#1e1b17;--text:#f0ece2;--muted:#a89e8d;--hint:#8a8378;
      --border:rgba(255,255,255,0.10);--border-mid:rgba(255,255,255,0.14);}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55}
  a{color:var(--accent-ui);text-decoration:none}
  a:hover{text-decoration:underline}
  header{background:var(--surface);border-bottom:.5px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  header h1{font-family:var(--serif);font-size:18px;font-weight:600;margin:0}
  header nav{margin-left:auto;display:flex;gap:14px;font-size:12px}
  header nav a{color:var(--muted)}
  main{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 46px)}
  @media (max-width:820px){main{grid-template-columns:1fr;height:auto}}
  .list-col{background:var(--surface);border-right:.5px solid var(--border);overflow-y:auto}
  .detail-col{overflow-y:auto;padding:20px 24px}
  .filters{padding:10px 14px;border-bottom:.5px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
  .filters select{padding:5px 8px;font-size:12px;border:.5px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font-family:inherit}
  .list-item{padding:12px 14px;border-bottom:.5px solid var(--border);cursor:pointer;transition:background .12s}
  .list-item:hover{background:var(--bg)}
  .list-item.active{background:rgba(6,95,70,0.06);border-left:3px solid var(--accent-ui);padding-left:11px}
  .li-top{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--hint);margin-bottom:4px}
  .li-cat{display:inline-block;padding:1px 6px;background:var(--bg);border-radius:8px;font-size:10.5px;color:var(--muted);font-weight:500}
  .li-status{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .li-status.open{background:#fef3c7;color:#92400e}
  .li-status.in-progress{background:#dbeafe;color:#1e40af}
  .li-status.resolved{background:#dcfce7;color:#166534}
  .li-subject{font-size:13.5px;font-weight:500;line-height:1.4;color:var(--text);margin-bottom:3px}
  .li-meta{font-size:11.5px;color:var(--muted)}
  .empty{padding:32px;text-align:center;color:var(--hint);font-size:13px}
  .detail-empty{padding:60px 24px;text-align:center;color:var(--hint);font-size:14px;line-height:1.7}
  .detail-head h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 8px}
  .detail-meta{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
  .detail-meta .chip{display:inline-block;padding:2px 8px;background:var(--surface);border:.5px solid var(--border);border-radius:10px;font-size:11px;margin-right:6px}
  .context-tile{background:var(--surface);border:.5px solid var(--border);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:pre-wrap;margin-bottom:16px;line-height:1.5}
  .messages{margin-bottom:18px}
  .msg-bubble{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;white-space:pre-wrap;font-size:13.5px;line-height:1.6}
  .msg-bubble.admin{background:rgba(6,95,70,0.04);border-color:rgba(6,95,70,0.15)}
  .msg-head{font-size:11px;color:var(--hint);margin-bottom:6px;display:flex;justify-content:space-between}
  .msg-head strong{color:var(--muted);font-weight:500}
  .reply-form{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:14px 16px}
  .reply-form textarea{width:100%;padding:10px 12px;font-size:13.5px;border:.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;line-height:1.55;min-height:110px;resize:vertical}
  .reply-form textarea:focus{outline:none;border-color:var(--accent-ui)}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:12.5px;border-radius:6px;border:.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent-ui);color:#fff;border-color:var(--accent-ui)}
  .btn.primary:hover{background:#054a37;border-color:#054a37}
  .btn.resolve{background:#166534;color:#fff;border-color:#166534}
  .btn.resolve:hover{background:#0f4a25}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  #authBanner{background:var(--danger);color:#fff;padding:24px;text-align:center;font-size:14px}
  #authBanner .btn{background:#fff;color:var(--danger);border-color:#fff}
</style>
</head>
<body>

<header>
  <h1>🎫 Folio support</h1>
  <nav>
    <a href="/admin/">← Admin home</a>
    <a href="/admin/users/">Users</a>
    <a href="/admin/promos/">Promos</a>
  </nav>
</header>

<div id="authBanner" style="display:none">
  <p>Sign in with an admin account to view support tickets.</p>
  <button class="btn" id="signInBtn" style="margin-top:8px">Sign in with Google</button>
</div>

<main id="mainCol" style="display:none">
  <aside class="list-col">
    <div class="filters">
      <select id="filterStatus" onchange="loadList()">
        <option value="open" selected>Open</option>
        <option value="in-progress">In progress</option>
        <option value="resolved">Resolved</option>
        <option value="">All statuses</option>
      </select>
      <select id="filterCategory" onchange="loadList()">
        <option value="">All categories</option>
        <option value="bug">🐛 Bug</option>
        <option value="billing">💳 Billing</option>
        <option value="feature">💡 Feature</option>
        <option value="affiliate">🤝 Affiliate</option>
        <option value="other">❓ Other</option>
      </select>
      <button class="btn" onclick="loadList()" style="margin-left:auto;padding:5px 10px;font-size:12px">↻</button>
    </div>
    <div id="listBody"></div>
  </aside>

  <section class="detail-col" id="detailCol">
    <div class="detail-empty">Select a ticket on the left.</div>
  </section>
</main>

<script>
  const PAYWALL_URL = 'https://folio-paywall.jacobdsiler.workers.dev';
  let _auth = null, _user = null;
  const state = { tickets: [], activeId: null };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function fmtDate(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
    } catch (_) { return ''; }
  }
  function catEmoji(c) {
    return c === 'bug' ? '🐛' : c === 'billing' ? '💳'
         : c === 'feature' ? '💡' : c === 'affiliate' ? '🤝' : '❓';
  }
  async function authHeaders() {
    const h = {};
    if (_user) {
      try { h['Authorization'] = 'Bearer ' + (await _user.getIdToken()); } catch (_) {}
    }
    return h;
  }

  async function loadList() {
    if (!_user) return;
    const status   = document.getElementById('filterStatus').value;
    const category = document.getElementById('filterCategory').value;
    const qs = new URLSearchParams();
    if (status)   qs.set('status', status);
    if (category) qs.set('category', category);
    const listBody = document.getElementById('listBody');
    listBody.innerHTML = '<div class="empty">Loading…</div>';
    try {
      const r = await fetch(PAYWALL_URL + '/support-list?' + qs.toString(), {
        headers: await authHeaders(),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
      state.tickets = data.tickets || [];
      renderList();
    } catch (e) {
      listBody.innerHTML = '<div class="empty" style="color:var(--danger)">Load failed: ' + esc(e.message) + '</div>';
    }
  }
  function renderList() {
    const listBody = document.getElementById('listBody');
    if (!state.tickets.length) {
      listBody.innerHTML = '<div class="empty">No tickets match.</div>';
      return;
    }
    listBody.innerHTML = state.tickets.map(t => (
      '<div class="list-item' + (state.activeId === t.id ? ' active' : '') + '" onclick="openTicket(\'' + esc(t.id) + '\')">' +
        '<div class="li-top">' +
          '<span class="li-cat">' + catEmoji(t.category) + ' ' + esc(t.category || 'other') + '</span>' +
          '<span class="li-status ' + esc(t.status || 'open') + '">' + esc(t.status || 'open') + '</span>' +
          '<span style="margin-left:auto">' + esc(fmtDate(t.createdAt)) + '</span>' +
        '</div>' +
        '<div class="li-subject">' + esc(t.subject || '(no subject)') + '</div>' +
        '<div class="li-meta">' + esc(t.reporterName || t.reporterEmail || 'unknown') + '</div>' +
      '</div>'
    )).join('');
  }
  window.openTicket = function (id) {
    state.activeId = id;
    renderList();
    const t = state.tickets.find(x => x.id === id);
    const col = document.getElementById('detailCol');
    if (!t) { col.innerHTML = '<div class="detail-empty">Ticket not in list — refresh.</div>'; return; }
    const ctx = t.context || {};
    const ctxLines = [];
    if (ctx.folioId)   ctxLines.push('folio: ' + ctx.folioId);
    if (ctx.url)       ctxLines.push('url: ' + ctx.url);
    if (ctx.build)     ctxLines.push('build: ' + ctx.build);
    if (ctx.userAgent) ctxLines.push('ua: ' + ctx.userAgent);
    const messages = Array.isArray(t.messages) ? t.messages : [];
    col.innerHTML = ''
      + '<div class="detail-head">'
      +   '<h2>' + esc(t.subject || '(no subject)') + '</h2>'
      +   '<div class="detail-meta">'
      +     '<span class="chip">' + catEmoji(t.category) + ' ' + esc(t.category || 'other') + '</span>'
      +     '<span class="chip">' + esc(t.status || 'open') + '</span>'
      +     '<span class="chip">' + esc(fmtDate(t.createdAt)) + '</span>'
      +     '<span class="chip"><a href="mailto:' + esc(t.reporterEmail) + '" style="color:var(--muted)">' + esc(t.reporterName || t.reporterEmail) + '</a></span>'
      +     (t.reporterUid ? '<span class="chip"><code>' + esc(t.reporterUid.slice(0, 8)) + '…</code></span>' : '')
      +   '</div>'
      + '</div>'
      + (ctxLines.length ? '<div class="context-tile">' + esc(ctxLines.join('\n')) + '</div>' : '')
      + '<div class="messages">'
      +   messages.map(m => (
            '<div class="msg-bubble ' + (m.from === 'admin' ? 'admin' : 'user') + '">'
          +   '<div class="msg-head"><strong>' + (m.from === 'admin' ? 'Folio' : esc(t.reporterName || t.reporterEmail || 'user')) + '</strong><span>' + esc(fmtDate(m.at)) + '</span></div>'
          +   esc(m.body || '')
          + '</div>'
          )).join('')
      + '</div>'
      + (t.status !== 'resolved'
          ? '<div class="reply-form">'
            + '<label style="font-size:11px;color:var(--muted);margin-bottom:6px;display:block">Reply to ' + esc(t.reporterEmail) + '</label>'
            + '<textarea id="replyBody" placeholder="Type your reply. This goes to their inbox with Reply-To back to folio@jacobsiler.com."></textarea>'
            + '<div class="actions">'
            +   '<button class="btn primary" onclick="sendReply(\'' + esc(t.id) + '\', this)">Send reply</button>'
            +   '<button class="btn resolve" onclick="resolveTicket(\'' + esc(t.id) + '\', false, this)">Mark resolved</button>'
            +   '<span id="replyMsg" style="font-size:12px;color:var(--muted)"></span>'
            + '</div>'
            + '</div>'
          : '<div class="detail-empty" style="padding:20px">Resolved on ' + esc(fmtDate(t.resolvedAt)) + '.</div>'
        );
  };
  window.sendReply = async function (id, btn) {
    const body = document.getElementById('replyBody').value.trim();
    const msg = document.getElementById('replyMsg');
    if (body.length < 2) { msg.textContent = 'Type something first.'; return; }
    btn.disabled = true; msg.textContent = 'Sending…';
    try {
      const r = await fetch(PAYWALL_URL + '/support-reply', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, await authHeaders()),
        body: JSON.stringify({ ticketId: id, body }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
      msg.textContent = 'Sent — reloading…';
      await loadList();
      openTicket(id);
    } catch (e) {
      msg.textContent = 'Failed: ' + e.message;
      btn.disabled = false;
    }
  };
  window.resolveTicket = async function (id, withNote, btn) {
    const note = withNote ? (prompt('Optional closing note (or blank):') || '') : '';
    if (!confirm('Mark this ticket resolved?')) return;
    btn.disabled = true;
    try {
      const r = await fetch(PAYWALL_URL + '/support-resolve', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, await authHeaders()),
        body: JSON.stringify({ ticketId: id, note }),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      await loadList();
      openTicket(id);
    } catch (e) {
      alert('Failed: ' + e.message);
      btn.disabled = false;
    }
  };

  (async function boot() {
    try {
      const appMod  = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const authMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
      const app = appMod.initializeApp({
        apiKey: 'AIzaSyDxLI57pgS9WX1ekMerbcx8M6aVeWacpy0',
        authDomain: 'auth.jacobsiler.com',
        projectId: 'miscellaneous-117e9',
        storageBucket: 'miscellaneous-117e9.firebasestorage.app',
        messagingSenderId: '514858431339',
        appId: '1:514858431339:web:8b3acbe89966b45fe3922e',
      }, 'admin-support');
      _auth = authMod.getAuth(app);
      const provider = new authMod.GoogleAuthProvider();
      authMod.onAuthStateChanged(_auth, function (u) {
        _user = u || null;
        if (u && !u.isAnonymous) {
          document.getElementById('authBanner').style.display = 'none';
          document.getElementById('mainCol').style.display = '';
          loadList();
        } else {
          document.getElementById('authBanner').style.display = '';
          document.getElementById('mainCol').style.display = 'none';
        }
      });
      document.getElementById('signInBtn').addEventListener('click', () => {
        authMod.signInWithPopup(_auth, provider).catch(e => alert('Sign-in failed: ' + e.message));
      });
    } catch (e) {
      console.error('[admin-support] boot failed:', e);
      document.getElementById('authBanner').style.display = '';
      document.getElementById('authBanner').innerHTML = '<p>Boot failed. Check console.</p>';
    }
  })();
</script>
</body>
</html>
